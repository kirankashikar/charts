name: Build, Test & Deploy to Vercel

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy-charts-vercel
  cancel-in-progress: true

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
  NEXT_PUBLIC_APP_URL: "https://charts.fluidpalette.com"

jobs:
  build-and-deploy:
    name: 🚀 Build, Test & Deploy charts.fluidpalette.com
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: 📦 Install Dependencies
        run: npm ci

      - name: ⚙️ Generate Prisma Client
        run: npx prisma generate

      - name: 🔍 Lint Codebase
        run: npm run lint

      - name: 🧪 Run Unit Tests
        run: npm test

      - name: 🗄️ Apply Database Migrations
        run: npx prisma migrate deploy

      - name: 🚀 Deploy to Vercel
        run: |
          npm install -g vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_RgsR9KzFsW3WYXwPCIQJl2XO
          VERCEL_PROJECT_ID: prj_dXyNZWM2yL5GNVuaorsIUIlUSv30

      - name: 🌐 Post-Deployment Endpoint Health Check
        run: |
          echo "Verifying live endpoint response for https://charts.fluidpalette.com..."
          curl -s -o /dev/null -w "charts.fluidpalette.com HTTP response: %{http_code}\n" https://charts.fluidpalette.com || true
          echo "Endpoint check finished."
