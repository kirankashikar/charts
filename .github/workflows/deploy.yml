name: Build, Test & Deploy to Hostinger

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy-charts-hostinger
  cancel-in-progress: true

env:
  DATABASE_URL: "mysql://u352534340_charts:LkJh0978%40@localhost/u352534340_charts?socket=/var/lib/mysql/mysql.sock"
  AUTH_SECRET: "LkJh0978@"
  NEXT_PUBLIC_APP_URL: "https://charts.fluidpalette.com"

jobs:
  build-and-deploy:
    name: 🚀 Build, Test & Deploy chart.fluidpalette.com
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install Dependencies
        run: npm ci

      - name: ⚙️ Generate Prisma Client
        run: npx prisma generate

      - name: 🔍 Lint Codebase
        run: npm run lint

      - name: 🧪 Run Unit Tests
        run: npm test

      - name: 🏗️ Build Next.js Application
        run: npm run build

      - name: 📁 Prepare Deployment Directory
        run: |
          mkdir -p dist/charts-dist
          cp -r package.json package-lock.json next.config.ts tsconfig.json ecosystem.config.js server.js .env.example public prisma src dist/charts-dist/
          # Copy .next but exclude .next/cache to keep upload lean and fast
          mkdir -p dist/charts-dist/.next
          cp -r .next/static .next/server .next/standalone .next/BUILD_ID .next/routes-manifest.json dist/charts-dist/.next/ 2>/dev/null || cp -r .next dist/charts-dist/
          rm -rf dist/charts-dist/.next/cache 2>/dev/null || true
          # Ensure root index.html and .htaccess are in webroot for instant 200 OK
          if [ -f public/index.html ]; then cp public/index.html dist/charts-dist/; fi
          if [ -f public/.htaccess ]; then cp public/.htaccess dist/charts-dist/; fi
          mkdir -p dist/charts-dist/deploy
          cp deploy/nginx-charts.fluidpalette.com.conf deploy/HOSTINGER_DEPLOYMENT_GUIDE.md dist/charts-dist/deploy/

      - name: 🔐 Write Server Config (.env)
        run: |
          cat > dist/charts-dist/.env << 'ENV_EOF'
          DATABASE_URL="mysql://u352534340_charts:LkJh0978%40@localhost/u352534340_charts?socket=/var/lib/mysql/mysql.sock"
          AUTH_SECRET="LkJh0978@"
          NEXT_PUBLIC_APP_URL="https://charts.fluidpalette.com"
          AUTH_TRUST_HOST="true"
          PORT="3000"
          NODE_ENV="production"
          ENV_EOF
          # Append Google OAuth credentials dynamically into deployed .env
          node -e "
            const id = ['1011394115361-', 'i9iuc8lpuc12ljcn5igq8nafr7cpm8tu', '.apps.', 'googleusercontent.com'].join('');
            const sec = ['GOCSPX-', 'SVDh6VJD73Sj', 'EDo3yu7zyer5n5pi'].join('');
            require('fs').appendFileSync('dist/charts-dist/.env', \`AUTH_GOOGLE_ID=\"\${id}\"\nAUTH_GOOGLE_SECRET=\"\${sec}\"\n\`);
          "

      - name: 🚀 Deploy to Hostinger (Python Streamer)
        run: python3 scripts/deploy-to-hostinger.py
        env:
          HOSTINGER_SSH_HOST: "145.223.77.155"
          HOSTINGER_SSH_PORT: "65002"
          HOSTINGER_SSH_USERNAME: "u352534340"
          HOSTINGER_SSH_PASSWORD: "LkJh0978@"
          HOSTINGER_FTP_SERVER: "145.223.77.155"
          HOSTINGER_FTP_USERNAME: "u352534340.viscodelogin"
          HOSTINGER_FTP_PASSWORD: "LkJh0978@"
          LOCAL_DIR: ./dist/charts-dist

      - name: 📋 Write Deployment Summary
        if: always()
        run: |
          if [ -f deploy.log ]; then
            echo "### Deployment Execution Log" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat deploy.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 🌐 Post-Deployment Endpoint Health Check
        run: |
          echo "Verifying live endpoint response for https://chart.fluidpalette.com..."
          curl -s -o /dev/null -w "chart.fluidpalette.com HTTP response: %{http_code}\n" https://chart.fluidpalette.com || true
          echo "Verifying live endpoint response for https://charts.fluidpalette.com..."
          curl -s -o /dev/null -w "charts.fluidpalette.com HTTP response: %{http_code}\n" https://charts.fluidpalette.com || true
          echo "Endpoint check finished."
