name: Build, Test & Deploy to Hostinger

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy-charts-hostinger
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: 🚀 Build, Test & Deploy chart.fluidpalette.com
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 Lint Codebase
        run: npm run lint

      - name: 🧪 Run Unit Tests
        run: npm test

      - name: ⚙️ Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'mysql://user:pass@localhost:3306/dummy' }}

      - name: 🏗️ Build Next.js Application
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'mysql://user:pass@localhost:3306/dummy' }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || '0123456789abcdef0123456789abcdef' }}
          NEXT_PUBLIC_APP_URL: "https://chart.fluidpalette.com"

      - name: 📁 Prepare Deployment Directory
        run: |
          mkdir -p dist/charts-dist
          cp -r package.json package-lock.json next.config.ts tsconfig.json ecosystem.config.js server.js .env.example public prisma src dist/charts-dist/
          # Copy .next but exclude .next/cache to keep upload lean and fast
          mkdir -p dist/charts-dist/.next
          cp -r .next/static .next/server .next/standalone .next/BUILD_ID .next/routes-manifest.json dist/charts-dist/.next/ 2>/dev/null || cp -r .next dist/charts-dist/
          rm -rf dist/charts-dist/.next/cache 2>/dev/null || true
          # Ensure root index.html and .htaccess are in webroot for instant 200 OK
          if [ -f public/index.html ]; then cp public/index.html dist/charts-dist/; fi
          if [ -f public/.htaccess ]; then cp public/.htaccess dist/charts-dist/; fi
          mkdir -p dist/charts-dist/deploy
          cp deploy/nginx-charts.fluidpalette.com.conf deploy/HOSTINGER_DEPLOYMENT_GUIDE.md dist/charts-dist/deploy/

      - name: 🔐 Write Server Config (.env)
        env:
          ENV_DB_URL: ${{ secrets.DATABASE_URL || 'mysql://u352534340_artntech:Kika2703%40@localhost/u352534340_fluidpalette?socket=/var/lib/mysql/mysql.sock' }}
          ENV_AUTH_SECRET: ${{ secrets.AUTH_SECRET || '9f82c44883ea24a25cbda393d258a1bb40f2884c59a35e80c35fa92efb1a2380' }}
          ENV_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
          ENV_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
        run: |
          cat > dist/charts-dist/.env << ENV_EOF
          DATABASE_URL="${ENV_DB_URL}"
          AUTH_SECRET="${ENV_AUTH_SECRET}"
          AUTH_GOOGLE_ID="${ENV_GOOGLE_ID}"
          AUTH_GOOGLE_SECRET="${ENV_GOOGLE_SECRET}"
          NEXT_PUBLIC_APP_URL="https://chart.fluidpalette.com"
          AUTH_TRUST_HOST="true"
          PORT="3000"
          NODE_ENV="production"
          ENV_EOF

      - name: 🔍 Diagnose Deployment Credentials
        env:
          FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER || vars.HOSTINGER_FTP_SERVER || 'ftp.fluidpalette.com' }}
          FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME || vars.HOSTINGER_FTP_USERNAME || 'u352534340.viscodelogin' }}
          FTP_PASSWORD_SET: ${{ (secrets.HOSTINGER_FTP_PASSWORD != '' || vars.HOSTINGER_FTP_PASSWORD != '' || secrets.viscodelogin != '' || vars.viscodelogin != '' || secrets.FTP_PASSWORD != '' || vars.FTP_PASSWORD != '') && '✅ Detected in GitHub environment' || '❌ NOT DETECTED (empty in secrets & vars)' }}
        run: |
          echo "Checking available deployment credentials:"
          echo "FTP Server:   $FTP_SERVER"
          echo "FTP Username: $FTP_USERNAME"
          echo "FTP Password: $FTP_PASSWORD_SET"

      - name: 🚀 Deploy to Hostinger (Python Streamer)
        run: python3 scripts/deploy-to-hostinger.py
        env:
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST || vars.HOSTINGER_SSH_HOST || 'ftp.fluidpalette.com' }}
          HOSTINGER_SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT || vars.HOSTINGER_SSH_PORT || 65002 }}
          HOSTINGER_SSH_USERNAME: ${{ secrets.HOSTINGER_SSH_USERNAME || vars.HOSTINGER_SSH_USERNAME || 'u352534340' }}
          HOSTINGER_SSH_PASSWORD: ${{ secrets.HOSTINGER_SSH_PASSWORD || secrets.HOSTINGER_PASSWORD || vars.HOSTINGER_PASSWORD || 'LkJh0978@' }}
          HOSTINGER_FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER || vars.HOSTINGER_FTP_SERVER || 'ftp.fluidpalette.com' }}
          HOSTINGER_FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME || vars.HOSTINGER_FTP_USERNAME || 'u352534340' }}
          HOSTINGER_FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD || secrets.HOSTINGER_PASSWORD || vars.HOSTINGER_PASSWORD || 'LkJh0978@' }}
          LOCAL_DIR: ./dist/charts-dist

      - name: 📋 Write Deployment Summary
        if: always()
        run: |
          if [ -f deploy.log ]; then
            echo "### Deployment Execution Log" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat deploy.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 🌐 Post-Deployment Endpoint Health Check
        run: |
          echo "Verifying live endpoint response for https://chart.fluidpalette.com..."
          curl -s -o /dev/null -w "chart.fluidpalette.com HTTP response: %{http_code}\n" https://chart.fluidpalette.com || true
          echo "Verifying live endpoint response for https://charts.fluidpalette.com..."
          curl -s -o /dev/null -w "charts.fluidpalette.com HTTP response: %{http_code}\n" https://charts.fluidpalette.com || true
          echo "Endpoint check finished."
